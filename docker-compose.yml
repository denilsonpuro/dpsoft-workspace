services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dpsoft
      POSTGRES_USER: dpsoft
      POSTGRES_PASSWORD: dpsoft
    ports: ["5432:5432"]
    volumes: ["dpsoft-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpsoft -d dpsoft"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["dpsoft-redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  dpsoft-postgres:
  dpsoft-redis:
